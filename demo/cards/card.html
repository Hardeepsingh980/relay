<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay demo card</title>
<style>
  :root { --bg: #fafafa; --ink: #262626; --muted: #6b6b6b; --blue: #008ae8; --blush: #fbcfe8; --lavender: #e6dafd;
          --mint: #b6edee; --powder: #cfe6fb; --butter: #fdf0b4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
         display: grid; place-items: center; overflow: hidden; }
  .wash { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .75; animation: drift 14s ease-in-out infinite alternate; }
  .w1 { width: 520px; height: 520px; background: var(--lavender); left: -120px; top: -140px; }
  .w2 { width: 460px; height: 460px; background: var(--mint); right: -100px; bottom: -160px; animation-delay: -4s; }
  .w3 { width: 360px; height: 360px; background: var(--blush); right: 18%; top: -160px; animation-delay: -8s; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }
  main { position: relative; text-align: center; max-width: 1100px; padding: 0 48px; }
  .mark { width: 96px; height: 96px; opacity: 0; animation: rise .8s .1s ease-out forwards; }
  h1 { font-size: 112px; letter-spacing: -4px; font-weight: 650; line-height: 1; margin-top: 24px; opacity: 0;
       animation: rise .8s .35s ease-out forwards; }
  .tag { font-size: 38px; letter-spacing: -.6px; line-height: 1.25; margin-top: 26px; color: var(--ink); opacity: 0;
         animation: rise .8s .7s ease-out forwards; }
  .pills { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 44px; opacity: 0;
           animation: rise .8s 1.1s ease-out forwards; }
  .pill { font-size: 22px; padding: 12px 22px; border-radius: 999px; background: #fff; border: 1px solid #e7e7e7; }
  .pill b { font-weight: 600; }
  .foot { font-size: 19px; color: var(--muted); margin-top: 40px; opacity: 0; animation: rise .8s 1.5s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  #__demo_cursor { display: none !important; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 2px; }
</style>
</head>
<body>
  <div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div>
  <main>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="1.5" y="1.5" width="21" height="21" rx="7" fill="#262626"/>
      <path d="M6.5 15.5c3.2 0 4-7 7.4-7h3.6" fill="none" stroke="#fafafa" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="6.6" cy="15.5" r="1.9" fill="#fafafa"/><circle cx="17.4" cy="8.5" r="1.9" fill="#008ae8"/>
    </svg>
    <h1 id="title">Relay</h1>
    <p class="tag" id="tag"></p>
    <div class="pills" id="pills"></div>
    <p class="foot" id="foot"></p>
  </main>
<script>
  const CARDS = {
    intro: {
      tag: "Keep your customers, and keep what your people know.",
      pills: [["#e6dafd", "Account Health"], ["#b6edee", "Handovers"], ["#fbcfe8", "Sales Assist"], ["#cfe6fb", "Ask"]],
      foot: "One FalkorDB graph per company · Demo data for Cheerio is fictional",
    },
    outro: {
      tag: "Every answer has a source. Every action waits for a person.",
      pills: [["#e6dafd", "Find the customer at risk"], ["#b6edee", "Keep what people know"], ["#fbcfe8", "Help on every call"]],
      foot: "Built on FalkorDB · Graph Hacks, Track 01: Agents That Act on Connected Data",
    },
  };
  const c = CARDS[location.hash.slice(1) || "intro"];
  document.getElementById("tag").textContent = c.tag;
  document.getElementById("foot").textContent = c.foot;
  document.getElementById("pills").innerHTML = c.pills
    .map(([color, text]) => `<span class="pill"><span class="dot" style="background:${color}"></span>${text}</span>`).join("");
</script>
</body>
</html>
